# anton's default run pipeline (anton-hrql). Copy this file, edit it, and the project owns its own
# pipeline — anton ships this only as the fallback for a repo that never ran the installer.
#
# The key is `formula`, NOT `name`: a formula keyed `name` parses and then fails `bd cook` with
# "name is required" (verified on bd 1.1.2, anton-upfc).
#
# Every step names its handler with a `step:<name>` label rather than a custom TOML key, because
# `bd cook` silently DROPS step keys it doesn't recognise. anton knows: step:implement, step:verify,
# step:review, step:commit, step:pr, and step:claude — the extension point, which dispatches a
# `prompt:<id>` or `skill:<id>` of the project's own with no anton code change. An unmapped step
# parks the run rather than being skipped.
#
# Labels must be LITERAL: bd resolves `{{var}}` in a step's title/description/notes but copies
# `labels` through verbatim, so a `prompt:{{prompt}}` would never resolve. anton parks on one at run
# start. To vary the pipeline by the work's own labels, map a label to a formula of its own in
# Settings → Pipeline variants.
formula = "anton-run"
description = "anton's default run pipeline: implement, verify, commit, self-review, open the PR. implement/commit/pr are anton's invariant floor — a run that never implements, never commits, or never reaches a human has no evidence of record. verify and review may be removed; that costs quality, never the run's integrity."
type = "workflow"
version = 1

# `target` is supplied by anton on every run (the run target's bead id); the default below only
# applies to a validation-only cook. A variable anton does not supply and that declares no default
# parks the run at its start — anton has no value to give it.
[vars]
[vars.target]
description = "The run target — the epic, feature, or standalone bead this run delivers"
default = "the run target"

[[steps]]
id = "implement"
type = "task"
title = "Implement {{target}}"
labels = ["step:implement"]

[[steps]]
id = "verify"
type = "task"
needs = ["implement"]
title = "Run the project's verify gates for {{target}}"
labels = ["step:verify"]

# Commit precedes review deliberately: the self-review gate reads the run's diff as
# `merge-base..HEAD`, so a review placed before the commit would read an empty diff and pass on
# nothing. The floor rejects that ordering rather than letting the gate silently pass.
[[steps]]
id = "commit"
type = "task"
needs = ["verify"]
title = "Commit the work for {{target}}"
labels = ["step:commit"]

[[steps]]
id = "review"
type = "task"
needs = ["commit"]
title = "Self-review {{target}} before the PR opens"
labels = ["step:review"]

# The PR is the pipeline's LAST step, and the floor requires that: anton stamps the PR ref when it
# opens, and a resumed run reads a live ref as proof the run finished — so a step added after the PR
# would be skipped by the next attempt if it failed. Put extra steps before the PR.
[[steps]]
id = "pr"
type = "task"
needs = ["review"]
title = "Open the pull request for {{target}}"
labels = ["step:pr"]
